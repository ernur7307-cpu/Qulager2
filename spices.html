<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дәмдеуіштер - Qulager</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Qulager — Түркістандағы таза ет және сүт өнімдері дүкені">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-wrapper">
        <img src="images/logo.svg" alt="Qulager" class="round-logo">
        <span class="logo">Qulager<span>Дүкені</span></span>
      </a>
      <nav class="nav"><a href="index.html">⬅ Басты бет</a></nav>
    </div>
  </header>

  <main class="section category-page">
    <div class="container">
      <h1 class="section-title center">Дәмдеуіштер</h1>

      <div class="category-quick-nav">
        <a href="meat.html" class="cat-pill">Ет өнімдері</a>
        <a href="dairy.html" class="cat-pill">Сүт өнімдері</a>
        <a href="poultry.html" class="cat-pill">Аң-құс</a>
        <a href="sub.html" class="cat-pill">Суб набор</a>
        <a href="spices.html" class="cat-pill active">Дәмдеуіштер</a>
        <a href="own.html" class="cat-pill">Біздің өнімдер</a>
      </div>

      <div class="menu-grid">
        <article class="menu-card">
          <div class="card-image"><img src="images/products/palau.svg" alt="Палауға арналған дәмдеуіш" loading="lazy"></div>
          <div class="card-body">
            <h3>Палауға арналған (100г)</h3>
            <span class="price">500 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="palau" data-name="Палауға арналған дәмдеуіш" data-price="500">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/kebab.svg" alt="Кәуап маринады" loading="lazy"></div>
          <div class="card-body">
            <h3>Кәуап маринады (150г)</h3>
            <span class="price">600 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="kebab" data-name="Кәуап маринады" data-price="600">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/pepper.svg" alt="Қара бұрыш ұнтағы" loading="lazy"></div>
          <div class="card-body">
            <h3>Қара бұрыш ұнтағы (50г)</h3>
            <span class="price">350 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="pepper" data-name="Қара бұрыш ұнтағы" data-price="350">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/universal.svg" alt="Әмбебап дәмдеуіш" loading="lazy"></div>
          <div class="card-body">
            <h3>Әмбебап дәмдеуіш (100г)</h3>
            <span class="price">400 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="universal" data-name="Әмбебап дәмдеуіш" data-price="400">Себетке қосу</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="footer simple">
    <p>© 2026 Qulager Ет және сүт өнімдері. Барлық құқық қорғалған.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
