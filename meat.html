<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ет өнімдері - Qulager</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Qulager — Түркістандағы таза ет және сүт өнімдері дүкені">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-wrapper">
        <img src="images/logo.svg" alt="Qulager" class="round-logo">
        <span class="logo">Qulager<span>Дүкені</span></span>
      </a>
      <nav class="nav"><a href="index.html">⬅ Басты бет</a></nav>
    </div>
  </header>

  <main class="section category-page">
    <div class="container">
      <h1 class="section-title center">Ет өнімдері</h1>

      <div class="category-quick-nav">
        <a href="meat.html" class="cat-pill active">Ет өнімдері</a>
        <a href="dairy.html" class="cat-pill">Сүт өнімдері</a>
        <a href="poultry.html" class="cat-pill">Аң-құс</a>
        <a href="sub.html" class="cat-pill">Суб набор</a>
        <a href="spices.html" class="cat-pill">Дәмдеуіштер</a>
        <a href="own.html" class="cat-pill">Біздің өнімдер</a>
      </div>

      <div class="menu-grid">
        <article class="menu-card">
          <div class="card-image"><img src="images/products/beef.svg" alt="Сиыр еті (сүйексіз)" loading="lazy"></div>
          <div class="card-body">
            <h3>Сиыр еті (сүйексіз, 1кг)</h3>
            <span class="price">3200 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="beef" data-name="Сиыр еті (сүйексіз)" data-price="3200">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/horse.svg" alt="Жылқы еті (сұр ет)" loading="lazy"></div>
          <div class="card-body">
            <h3>Жылқы еті (сұр ет, 1кг)</h3>
            <span class="price">3800 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="horse" data-name="Жылқы еті (сұр ет)" data-price="3800">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/qazy.svg" alt="Қолдың қазысы" loading="lazy"></div>
          <div class="card-body">
            <h3>Қолдың қазысы (1кг)</h3>
            <span class="price">4500 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="qazy" data-name="Қолдың қазысы" data-price="4500">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/lamb.svg" alt="Жас қой еті" loading="lazy"></div>
          <div class="card-body">
            <h3>Жас қой еті (1кг)</h3>
            <span class="price">2800 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="lamb" data-name="Жас қой еті" data-price="2800">Себетке қосу</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="footer simple">
    <p>© 2026 Qulager Ет және сүт өнімдері. Барлық құқық қорғалған.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
