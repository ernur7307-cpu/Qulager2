<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аң-құс - Qulager</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Qulager — Түркістандағы таза ет және сүт өнімдері дүкені">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-wrapper">
        <img src="images/logo.svg" alt="Qulager" class="round-logo">
        <span class="logo">Qulager<span>Дүкені</span></span>
      </a>
      <nav class="nav"><a href="index.html">⬅ Басты бет</a></nav>
    </div>
  </header>

  <main class="section category-page">
    <div class="container">
      <h1 class="section-title center">Аң-құс</h1>

      <div class="category-quick-nav">
        <a href="meat.html" class="cat-pill">Ет өнімдері</a>
        <a href="dairy.html" class="cat-pill">Сүт өнімдері</a>
        <a href="poultry.html" class="cat-pill active">Аң-құс</a>
        <a href="sub.html" class="cat-pill">Суб набор</a>
        <a href="spices.html" class="cat-pill">Дәмдеуіштер</a>
        <a href="own.html" class="cat-pill">Біздің өнімдер</a>
      </div>

      <div class="menu-grid">
        <article class="menu-card">
          <div class="card-image"><img src="images/products/chicken.svg" alt="Бүтін тауық" loading="lazy"></div>
          <div class="card-body">
            <h3>Бүтін тауық (1кг)</h3>
            <span class="price">1600 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="chicken" data-name="Бүтін тауық" data-price="1600">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/quail.svg" alt="Бөдене еті" loading="lazy"></div>
          <div class="card-body">
            <h3>Бөдене еті (1 дана)</h3>
            <span class="price">800 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="quail" data-name="Бөдене еті" data-price="800">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/fillet.svg" alt="Тауық филесі" loading="lazy"></div>
          <div class="card-body">
            <h3>Тауық филесі (1кг)</h3>
            <span class="price">2200 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="fillet" data-name="Тауық филесі" data-price="2200">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/wings.svg" alt="Тауық қанаттары" loading="lazy"></div>
          <div class="card-body">
            <h3>Тауық қанаттары (1кг)</h3>
            <span class="price">1800 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="wings" data-name="Тауық қанаттары" data-price="1800">Себетке қосу</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="footer simple">
    <p>© 2026 Qulager Ет және сүт өнімдері. Барлық құқық қорғалған.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
