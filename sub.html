<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Суб набор - Qulager</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Qulager — Түркістандағы таза ет және сүт өнімдері дүкені">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-wrapper">
        <img src="images/logo.svg" alt="Qulager" class="round-logo">
        <span class="logo">Qulager<span>Дүкені</span></span>
      </a>
      <nav class="nav"><a href="index.html">⬅ Басты бет</a></nav>
    </div>
  </header>

  <main class="section category-page">
    <div class="container">
      <h1 class="section-title center">Суб набор</h1>

      <div class="category-quick-nav">
        <a href="meat.html" class="cat-pill">Ет өнімдері</a>
        <a href="dairy.html" class="cat-pill">Сүт өнімдері</a>
        <a href="poultry.html" class="cat-pill">Аң-құс</a>
        <a href="sub.html" class="cat-pill active">Суб набор</a>
        <a href="spices.html" class="cat-pill">Дәмдеуіштер</a>
        <a href="own.html" class="cat-pill">Біздің өнімдер</a>
      </div>

      <div class="menu-grid">
        <article class="menu-card">
          <div class="card-image"><img src="images/products/liver.svg" alt="Сиыр бауыры" loading="lazy"></div>
          <div class="card-body">
            <h3>Сиыр бауыры (1кг)</h3>
            <span class="price">1500 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="liver" data-name="Сиыр бауыры" data-price="1500">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/heart.svg" alt="Сиыр жүрегі" loading="lazy"></div>
          <div class="card-body">
            <h3>Сиыр жүрегі (1кг)</h3>
            <span class="price">1800 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="heart" data-name="Сиыр жүрегі" data-price="1800">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/head.svg" alt="Қойдың бас-сирағы" loading="lazy"></div>
          <div class="card-body">
            <h3>Қойдың бас-сирағы</h3>
            <span class="price">2500 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="head" data-name="Қойдың бас-сирағы" data-price="2500">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/tongue.svg" alt="Сиыр тілі" loading="lazy"></div>
          <div class="card-body">
            <h3>Сиыр тілі (1кг)</h3>
            <span class="price">3000 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="tongue" data-name="Сиыр тілі" data-price="3000">Себетке қосу</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="footer simple">
    <p>© 2026 Qulager Ет және сүт өнімдері. Барлық құқық қорғалған.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
