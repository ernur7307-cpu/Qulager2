<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сүт өнімдері - Qulager</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Qulager — Түркістандағы таза ет және сүт өнімдері дүкені">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dark">
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-wrapper">
        <img src="images/logo.svg" alt="Qulager" class="round-logo">
        <span class="logo">Qulager<span>Дүкені</span></span>
      </a>
      <nav class="nav"><a href="index.html">⬅ Басты бет</a></nav>
    </div>
  </header>

  <main class="section category-page">
    <div class="container">
      <h1 class="section-title center">Сүт өнімдері</h1>

      <div class="category-quick-nav">
        <a href="meat.html" class="cat-pill">Ет өнімдері</a>
        <a href="dairy.html" class="cat-pill active">Сүт өнімдері</a>
        <a href="poultry.html" class="cat-pill">Аң-құс</a>
        <a href="sub.html" class="cat-pill">Суб набор</a>
        <a href="spices.html" class="cat-pill">Дәмдеуіштер</a>
        <a href="own.html" class="cat-pill">Біздің өнімдер</a>
      </div>

      <div class="menu-grid">
        <article class="menu-card">
          <div class="card-image"><img src="images/products/milk.svg" alt="Табиғи сиыр сүті" loading="lazy"></div>
          <div class="card-body">
            <h3>Табиғи сиыр сүті (1л)</h3>
            <span class="price">400 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="milk" data-name="Табиғи сиыр сүті" data-price="400">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/ayran.svg" alt="Қолдың айраны" loading="lazy"></div>
          <div class="card-body">
            <h3>Қолдың айраны (1л)</h3>
            <span class="price">450 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="ayran" data-name="Қолдың айраны" data-price="450">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/qaymaq.svg" alt="Майлы қаймақ" loading="lazy"></div>
          <div class="card-body">
            <h3>Майлы қаймақ (500г)</h3>
            <span class="price">1200 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="qaymaq" data-name="Майлы қаймақ" data-price="1200">Себетке қосу</button>
          </div>
        </article>
        <article class="menu-card">
          <div class="card-image"><img src="images/products/qurt.svg" alt="Түркістан құрты" loading="lazy"></div>
          <div class="card-body">
            <h3>Түркістан құрты (1кг)</h3>
            <span class="price">3500 ₸</span>
            <button class="btn btn-block add-to-cart" data-id="qurt" data-name="Түркістан құрты" data-price="3500">Себетке қосу</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="footer simple">
    <p>© 2026 Qulager Ет және сүт өнімдері. Барлық құқық қорғалған.</p>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
